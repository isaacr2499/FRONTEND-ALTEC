<div class="modern-dashboard">

  <!-- 🎨 HERO SECTION -->
  <div class="dashboard-hero">
    <div class="container">
      <div class="hero-content text-center">
        <h1 class="hero-title animate-fade-in">
          ¡Bienvenido, <span class="name-highlight">{{ name }}</span>! 👋
        </h1>
        <p class="hero-subtitle animate-fade-in-delay">
          ¿Qué deseas hacer hoy?
        </p>
      </div>
    </div>
  </div>

  <!-- 📦 GRID DE ACCIONES -->
  <div class="dashboard-content">
    <div class="container-fluid dashboard-grid-wrapper">

      <!-- Grid de cards -->
      <div class="actions-grid">

        <!-- Card: Cotizador -->
        <a [routerLink]="['/product-quote']" class="action-card">
          <div class="card-icon-wrapper">
            <img src="assets/images/Cotizador.png" alt="Cotizador" class="card-image">
          </div>
          <div class="card-overlay">
            <i class="bi bi-calculator-fill overlay-icon"></i>
            <h3 class="card-title">Cotizador</h3>
            <p class="card-description">Genera cotizaciones rápidas</p>
          </div>
        </a>

        <!-- Card: Historial -->
        <a [routerLink]="['/historic-sales']" class="action-card">
          <div class="card-icon-wrapper">
            <img src="assets/images/Historial.png" alt="Historial" class="card-image">
          </div>
          <div class="card-overlay">
            <i class="bi bi-clock-history overlay-icon"></i>
            <h3 class="card-title">Historial</h3>
            <p class="card-description">Revisa movimientos</p>
          </div>
        </a>

        <!-- Card: Bodega -->
        <a [routerLink]="['/warehouse/inventario']" class="action-card">
          <div class="card-icon-wrapper">
            <img src="assets/images/Bodega.png" alt="Bodega" class="card-image">
          </div>
          <div class="card-overlay">
            <i class="bi bi-archive-fill overlay-icon"></i>
            <h3 class="card-title">Bodega</h3>
            <p class="card-description">Consulta inventario</p>
          </div>
        </a>

        <!-- Card: Vender -->
        <a [routerLink]="['/sales-module']" class="action-card">
          <div class="card-icon-wrapper">
            <img src="assets/images/Vender.png" alt="Vender" class="card-image">
          </div>
          <div class="card-overlay">
            <i class="bi bi-cart-check-fill overlay-icon"></i>
            <h3 class="card-title">Vender</h3>
            <p class="card-description">Gestiona ventas</p>
          </div>
        </a>

        <!-- Card: Altec-Puntos -->
        <a [routerLink]="['/altec-points']" class="action-card">
          <div class="card-icon-wrapper">
            <img src="assets/images/acreditar-puntos.png" alt="Altec-Puntos" class="card-image">
          </div>
          <div class="card-overlay">
            <i class="bi bi-star-fill overlay-icon"></i>
            <h3 class="card-title">Altec-Puntos</h3>
            <p class="card-description">Acredita puntos</p>
          </div>
        </a>

        <!-- Card: Administrar Usuarios -->
        <a [routerLink]="['/user-admin']" class="action-card">
          <div class="card-icon-wrapper">
            <img src="assets/images/user-admin.png" alt="Admin Usuarios" class="card-image">
          </div>
          <div class="card-overlay">
            <i class="bi bi-people-fill overlay-icon"></i>
            <h3 class="card-title">Usuarios</h3>
            <p class="card-description">Administra usuarios</p>
          </div>
        </a>

      </div>
    </div>
  </div>

  <!-- 🦶 FOOTER -->
  <footer class="dashboard-footer text-center">
    <p class="footer-text mb-0">
      Developed by <strong class="brand-purple">SwiFt©</strong> 2025
    </p>
  </footer>

</div>
